<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Architecture Flow Canvas</title>
<style>
:root{--bg:#070d1a;--panel:#101a31;--node:#1a2a4c;--text:#eaf2ff;--muted:#a1b4dc;--act:#38bdf8;--done:#22c55e;--dim:#233457;--loopA:#ff5d8f;--loopB:#2dd4bf;--loopC:#84cc16;--loopD:#a78bfa;--loopT:#fb923c}
*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial}body{margin:0;background:radial-gradient(circle at 20% 0,#13264f,#070d1a 55%);color:var(--text)}
.app{display:grid;grid-template-columns:1fr 360px;gap:10px;padding:10px;max-width:1500px;margin:auto}.left,.right{background:rgba(16,26,49,.95);border:1px solid #304b80;border-radius:12px}.left{padding:10px}.right{padding:10px}
.controls button,.controls select,.controls input{width:100%;margin:5px 0;padding:8px;background:#0d1730;color:var(--text);border:1px solid #3a5d97;border-radius:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.canvasWrap{position:relative;height:560px;background:#0a1328;border:1px solid #2d467a;border-radius:10px;overflow:hidden}
.node{position:absolute;width:150px;min-height:50px;padding:6px;border-radius:8px;background:var(--node);border:1px solid #4668aa;font-size:11px;line-height:1.2;color:var(--text);transition:.2s}
.node.active{box-shadow:0 0 14px var(--act);border-color:var(--act)}.node.done{border-color:var(--done);background:#163740}.node.dim{opacity:.35}
.gov{height:56px;width:330px;background:#243557;border-color:#5f7fbc}
svg{position:absolute;inset:0}.edge{stroke:#4568aa;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{fill:#b9cbf1;font-size:10px}.activeEdge{stroke:var(--act);stroke-width:3;stroke-dasharray:8 6;animation:dash .8s linear infinite}.loop{stroke-dasharray:5 5}.loopA{stroke:var(--loopA)}.loopB{stroke:var(--loopB)}.loopC{stroke:var(--loopC)}.loopD{stroke:var(--loopD)}.loopT{stroke:var(--loopT)}@keyframes dash{to{stroke-dashoffset:-28}}
.token{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 20px var(--act);pointer-events:none;transform:translate(-7px,-7px)}
.panel{background:#0b1430;border:1px solid #2f497c;border-radius:9px;padding:8px;margin-top:8px}.log,.trace{height:120px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;background:#091126;border:1px solid #2e497d;border-radius:8px;padding:6px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}.k{background:#091126;border:1px solid #2e497d;border-radius:8px;padding:6px}.v{font-size:16px;font-weight:700}
</style></head><body><div class='app'><section class='left'><h3 style='margin:4px 0'>Animated Architecture Flow Canvas</h3><div class='canvasWrap' id='wrap'>
<svg id='svg' viewBox='0 0 1100 560' preserveAspectRatio='none'><defs><marker id='arrow' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><polygon points='0,0 10,4 0,8' fill='#4568aa'/></marker></defs></svg><div class='token' id='token' style='display:none'></div></div>
<div class='panel'><b>Loop Trace</b><div class='trace' id='trace'></div></div></section>
<aside class='right'><div class='controls'><select id='scenario'></select><div class='btns'><button id='run'>Run</button><button id='runAll'>Run All</button><button id='pause'>Pause</button><button id='resume'>Resume</button><button id='step'>Step +1</button><button id='reset'>Reset</button></div><label>Speed <span id='sl'>900ms</span></label><input type='range' id='speed' min='250' max='2200' step='50' value='900'></div>
<div class='panel'><b>Scenario Preview</b><div id='preview' style='font-size:12px;color:var(--muted)'></div></div>
<div class='panel'><b>KPIs</b><div class='kpis'><div class='k'>Cycle<div class='v' id='kCycle'>0</div></div><div class='k'>Status<div class='v' id='kStatus'>READY</div></div><div class='k'>Loops<div class='v' id='kLoops'>-</div></div><div class='k'>Proof<div class='v' id='kProof'>No</div></div><div class='k'>Human<div class='v' id='kHuman'>No</div></div><div class='k'>PO<div class='v' id='kPO'>-</div></div></div></div>
<div class='panel'><b>Execution Log</b><div class='log' id='log'></div></div></aside></div>
<script>
const scenarios=[{ name:'Happy path: clean PO, no exceptions', poId:'PO-1001', actor:'supplier-alpha', amountEUR:12000, poQty:100, grQty:100, invoiceAmount:12000, currency:'EUR' },{ name:'Quantity mismatch: GR differs from PO, human resolves', poId:'PO-1002', actor:'supplier-alpha', amountEUR:15000, poQty:100, grQty:95, invoiceAmount:15000, currency:'EUR' },{ name:'Invoice amount mismatch', poId:'PO-1003', actor:'manufacturer-1', amountEUR:18000, poQty:50, grQty:50, invoiceAmount:17900, currency:'EUR' },{ name:'High-value PO: mandatory blockchain proof > €50k', poId:'PO-1004', actor:'supplier-alpha', amountEUR:70000, poQty:10, grQty:10, invoiceAmount:70000, currency:'EUR' },{ name:'Duplicate PO rejected', poId:'PO-1001', actor:'supplier-alpha', amountEUR:12000, poQty:100, grQty:100, invoiceAmount:12000, currency:'EUR' },{ name:'Corrupt data rejected', poId:'PO-1005', actor:'supplier-alpha', amountEUR:5000, poQty:10, grQty:10, currency:'EUR' },{ name:'Unauthorized actor rejected', poId:'PO-1006', actor:'unknown-supplier', amountEUR:6000, poQty:20, grQty:20, invoiceAmount:6000, currency:'EUR' },{ name:'Smart contract timeout Loop T', poId:'PO-1007', actor:'manufacturer-1', amountEUR:90000, poQty:4, grQty:4, invoiceAmount:90000, currency:'EUR', smartContractTimeout:true },{ name:'Retry limit exceeded terminal', poId:'PO-1008', actor:'supplier-alpha', amountEUR:20000, poQty:30, grQty:20, invoiceAmount:20000, currency:'EUR', unresolvable:true },{ name:'Partial delivery split payment', poId:'PO-1009', actor:'logistics-7', amountEUR:24000, poQty:100, grQty:60, invoiceAmount:24000, currency:'EUR', partialDelivery:true },{ name:'Compliance audit mandatory on-chain proof', poId:'PO-1010', actor:'retailer-9', amountEUR:8000, poQty:12, grQty:12, invoiceAmount:8000, currency:'EUR', complianceAuditFlag:true },{ name:'Direct reroute Loop C', poId:'PO-1011', actor:'supplier-alpha', amountEUR:3000, poQty:5, grQty:5, invoiceAmount:3000, currency:'EUR', directFromEntry:true },{ name:'Manual-only workflow route', poId:'PO-1012', actor:'manufacturer-1', amountEUR:11000, poQty:40, grQty:40, invoiceAmount:11000, currency:'EUR', manualOnly:true }];
const trusted=new Set(['supplier-alpha','manufacturer-1','logistics-7','retailer-9']);const seen=new Set();
const nodes={ext:[20,170],int:[20,260],erp:[205,215],entry:[390,215],gov:[390,40],lcnc:[565,215],rpa:[730,215],val:[890,215],ex:[730,320],bd:[565,120],ledger:[730,120],off:[890,120],down:[890,320],mon:[890,430]};
const names={ext:'External Actor / Supplier',int:'Internal Actor / Procurement',erp:'ERP / Source Systems',entry:'Event Entry Gate',gov:'Governance Layer',lcnc:'LCNC Workflow Engine',rpa:'RPA Execution Bot',val:'Validation Bot',ex:'Exception Handling / Human Review',bd:'Blockchain Decision',ledger:'Blockchain Ledger / Smart Contract',off:'Off-chain Traceability Store',down:'Downstream Actions',mon:'Monitoring / KPI Feedback'};
const edges=[['ext','erp','event submission'],['int','erp','event submission'],['erp','entry','source event'],['entry','lcnc','validated event'],['gov','lcnc','governance rules'],['gov','bd','governance rules'],['lcnc','rpa','RPA route'],['rpa','val','automation output'],['val','bd','validation result'],['bd','ledger','proof required'],['bd','down','bypass'],['ledger','off','proof + hash'],['off','down','operational record'],['down','mon','KPI data']];
const loopEdges={A:['val','ex','exception loop'],A2:['ex','lcnc','exception loop'],B:['bd','down','bypass'],C:['down','lcnc','re-entry trigger'],D:['mon','gov','monitoring feedback'],D2:['mon','lcnc','monitoring feedback'],T:['ledger','ex','timeout fallback']};
let paused=false,grant=0,running=false;const $=id=>document.getElementById(id);const ns='http://www.w3.org/2000/svg';
function addNode(k){const d=document.createElement('div');d.className='node'+(k==='gov'?' gov':' dim');d.id='n_'+k;d.style.left=nodes[k][0]+'px';d.style.top=nodes[k][1]+'px';d.innerHTML='<b>'+names[k]+'</b>';$('wrap').appendChild(d)}
function line(a,b,cls,label,id){const p1=nodes[a],p2=nodes[b],path=document.createElementNS(ns,'path');const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;path.setAttribute('d',`M ${p1[0]+150} ${p1[1]+25} Q ${mx} ${my} ${p2[0]} ${p2[1]+25}`);path.setAttribute('class',cls);path.id=id;$('svg').appendChild(path);const t=document.createElementNS(ns,'text');t.setAttribute('x',mx);t.setAttribute('y',my-4);t.setAttribute('class','label');t.textContent=label;$('svg').appendChild(t)}
function build(){Object.keys(nodes).forEach(addNode);edges.forEach((e,i)=>line(e[0],e[1],'edge',e[2],'e'+i));line(...loopEdges.A,'edge loop loopA','A: exception loop','lA');line(...loopEdges.A2,'edge loop loopA','A: return','lA2');line(...loopEdges.B,'edge loop loopB','B: no proof','lB');line(...loopEdges.C,'edge loop loopC','C: re-entry','lC');line(...loopEdges.D,'edge loop loopD','D: feedback','lD');line(...loopEdges.D2,'edge loop loopD','D: feedback','lD2');line(...loopEdges.T,'edge loop loopT','T: timeout','lT');}
function setNode(k,state){const n=$('n_'+k);if(!n)return;n.classList.remove('active','done','dim');if(state==='active')n.classList.add('active');if(state==='done')n.classList.add('done');if(state==='dim')n.classList.add('dim')}
function activateEdge(id,on=true){const p=$(id);if(!p)return;p.classList.toggle('activeEdge',on)}
function log(m){$('log').textContent+=m+'\n';$('log').scrollTop=$('log').scrollHeight}
function trace(m){$('trace').textContent+=m+'\n';$('trace').scrollTop=$('trace').scrollHeight}
async function wait(){while(paused&&grant===0)await new Promise(r=>setTimeout(r,80));if(grant>0)grant--;await new Promise(r=>setTimeout(r,+$('speed').value))}
async function move(a,b,id){const t=$('token');t.style.display='block';activateEdge(id,true);const [x1,y1]=[nodes[a][0]+150,nodes[a][1]+25],[x2,y2]=[nodes[b][0],nodes[b][1]+25];for(let i=0;i<=20;i++){const f=i/20;t.style.left=(x1+(x2-x1)*f)+'px';t.style.top=(y1+(y2-y1)*f)+'px';await new Promise(r=>setTimeout(r,Math.max(12,+$('speed').value/24)))}activateEdge(id,false)}
function resetUI(){document.querySelectorAll('.node').forEach(n=>n.className=n.className.includes('gov')?'node gov':'node dim');$('log').textContent='';$('trace').textContent='';$('kCycle').textContent='0';$('kStatus').textContent='READY';$('kLoops').textContent='-';$('kProof').textContent='No';$('kHuman').textContent='No';$('token').style.display='none'}
async function run(s){running=true;resetUI();$('kPO').textContent=s.poId||'-';$('preview').textContent=`${s.name}\nPO: ${s.poId}\nActor: ${s.actor}\nAmount: €${s.amountEUR}`;let c=0,loops=[],proof=false,human=false,status='IN_PROGRESS';
for(const k of Object.keys(nodes)) if(k!=='gov') setNode(k,'dim'); setNode('gov','done');
setNode('ext','active');c++;await wait();await move('ext','erp','e0');setNode('ext','done');setNode('erp','active');log('event submission from actor');
if(!trusted.has(s.actor)){status='REJECTED';log('unauthorized actor');}
if(status!=='REJECTED'){await move('erp','entry','e2');setNode('entry','active');c++;await wait();if(['poId','actor','amountEUR','poQty','grQty','invoiceAmount','currency'].some(k=>s[k]==null)){status='REJECTED';log('corrupt data rejected')} else if(seen.has(s.poId)){status='REJECTED';log('duplicate PO rejected')} else seen.add(s.poId)}
if(status!=='REJECTED'){await move('entry','lcnc','e3');await move('gov','lcnc','e4');setNode('entry','done');setNode('lcnc','active');c++;await wait();
if(s.manualOnly){loops.push('A');human=true;await move('lcnc','rpa','e6');await move('rpa','val','e7');await move('val','ex','lA');trace('Loop A manual/exception');await move('ex','lcnc','lA2');}
await move('lcnc','rpa','e6');setNode('rpa','active');c++;await wait();await move('rpa','val','e7');setNode('val','active');c++;await wait();
let mism=[];if(s.poQty!==s.grQty)mism.push('QTY');if(s.amountEUR!==s.invoiceAmount)mism.push('INV');if(mism.length){loops.push('A');human=true;await move('val','ex','lA');trace('Loop A '+mism.join('/'));setNode('ex','active');c++;await wait();if(s.unresolvable){status='TERMINAL';log('retry limit exceeded')}}
if(status!=='TERMINAL'){await move('val','bd','e8');await move('gov','bd','e5');setNode('bd','active');c++;await wait();const need=s.amountEUR>50000||s.complianceAuditFlag;
if(!need){const lp=s.directFromEntry?'C':'B';loops.push(lp);await move('bd','down',lp==='C'?'lC':'e10');trace('Loop '+lp+' bypass/re-entry');}
else{proof=true;await move('bd','ledger','e9');setNode('ledger','active');c++;await wait();if(s.smartContractTimeout){loops.push('T');human=true;await move('ledger','ex','lT');trace('Loop T timeout fallback');setNode('ex','active');c++;await wait();}await move('ledger','off','e11');setNode('off','active');c++;await wait();await move('off','down','e12');}
setNode('down','active');c++;await wait();await move('down','mon','e13');setNode('mon','active');c++;status='COMPLETE';}
}
loops.push('D');trace('Loop D monitoring feedback');await move('mon','gov','lD');await move('mon','lcnc','lD2');
$('kCycle').textContent=c;$('kStatus').textContent=status;$('kLoops').textContent=loops.join(', ');$('kProof').textContent=proof?'Yes':'No';$('kHuman').textContent=human?'Yes':'No';running=false}
async function runAll(){if(running)return;for(const s of scenarios){await run(s);await new Promise(r=>setTimeout(r,250));}}
$('speed').oninput=e=>$('sl').textContent=e.target.value+'ms';$('pause').onclick=()=>paused=true;$('resume').onclick=()=>{paused=false;grant=0};$('step').onclick=()=>{paused=true;grant++};$('reset').onclick=()=>{paused=false;grant=0;running=false;resetUI();$('preview').textContent=''};
$('run').onclick=()=>!running&&run(scenarios[+$('scenario').value]);$('runAll').onclick=()=>runAll();scenarios.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;$('scenario').appendChild(o)});$('scenario').onchange=()=>{$('preview').textContent=scenarios[+$('scenario').value].name};build();resetUI();$('preview').textContent=scenarios[0].name;
</script></body></html>
